<!--
  Appended to the <head> of every wanshi page, after wanshi's own main.css, so
  plain CSS overrides anything it sets. Two jobs:

    1. Bridge wanshi's "Parchment & walnut" palette to this site's tokens.
    2. Style the nav and footer injected by import-header.html / -footer.html
       (generated by scripts/gen-wanshi-chrome.ts).

  Rules mirror src/styles/global.css, src/components/Nav.astro and
  src/components/Footer.astro. Those are Astro-scoped styles, so they cannot be
  shared with a standalone wanshi page — the values below are the bridge, and
  changing a colour means changing it in both places.
-->
<style>
  /*
   * Palette bridge. wanshi's design was derived from this site, so --bg,
   * --surface and --border already match exactly; only these four differ.
   * wanshi declares its tokens on `:root body`, so the override has to match
   * that specificity — a bare `:root` would lose.
   */
  :root body {
    --muted: #7A5038;
    --ink: #4A3020;
    --accent: #8C2020;
    --accent-hover: #721A1A;

    /* Derived from --accent; wanshi hardcodes these as literal rgba() of its
       own accent, so they need restating against the site's. */
    --hover-color-block: rgba(140, 32, 32, 0.05);
    --hover-color-link: rgba(140, 32, 32, 0.12);

    /* Site chrome matches the body gutter on desktop, where wanshi already
       pads the body; below 1000px it removes that padding, so the chrome
       supplies its own to stay off the screen edge. */
    --site-chrome-pad: 0rem;
  }

  /*
   * Below 1000px wanshi drops the body padding, so the chrome supplies its own.
   * These track --pad-h in global.css (3rem, then 1.5rem under the site's
   * 680px breakpoint) so the nav keeps the same gutter as every other page at
   * every width, not just on desktop.
   */
  @media only screen and (max-width: 1000px) {
    :root body {
      --site-chrome-pad: 3rem;
    }
  }

  @media only screen and (max-width: 680px) {
    :root body {
      --site-chrome-pad: 1.5rem;
    }
  }

  /*
   * wanshi drops the body 2rem from the top of the viewport, which suits a page
   * that opens on its breadcrumb. This one opens on the site nav, which belongs
   * flush at the top like every other page on the site.
   */
  @media only screen and (min-width: 1000px) {
    body {
      margin-top: 0;
    }
  }

  /*
   * ── Page frame ────────────────────────────────────────────────────────────
   *
   * Bring the notes page frame into line with the rest of the site. Astro pages
   * are capped at --page-max (960px); wanshi's default works out to 1194-1327px,
   * so the shared nav and footer visibly snapped to a different width when you
   * crossed between them — a ~234-367px jump on the same two elements.
   *
   * Two overrides, and neither touches the article/sidebar structure:
   *
   *   --article-max-width  wanshi grows the reading column with the viewport
   *                        (clamp(90ex, 50vw, 108ex) = 666-799px). Capping the
   *                        top end at 700px pins it to the site's --notes-max,
   *                        so prose is measured identically on /about and on a
   *                        note. The floor and the fluid middle are kept.
   *
   *   body max-width       wanshi reserves 33rem (528px) beside the article for
   *                        the sidebar, which is far more than the table of
   *                        contents uses — [toc].max-width in Wanshi.toml caps
   *                        it at 45ex (~333px). 22rem leaves the sidebar ~288px
   *                        after the 2rem body gutters and brings the frame to
   *                        1018-1052px.
   *
   * Three things want different widths, so they get different widths:
   *
   *   chrome TEXT   fixed at 864px, the content box of a --page-max Astro page.
   *                 The nav is `space-between`, so any change here moves the
   *                 name and `cv` and the header stops reading as the same
   *                 furniture across the site. This is the invariant.
   *   chrome RULES  full width of the frame. The 2px accent borders are
   *                 separators, not content — letting them run wide makes a
   *                 notes page feel like the roomier thing it is.
   *   note CONTENT  grows with the frame, up to a readable cap.
   *
   * The trick for the chrome is padding rather than a wrapper element: the
   * border is painted on the element's outer edge, so pushing the *content*
   * inward with a computed inline padding keeps the rule full-bleed while the
   * text stays at 864px. `100%` in that calc resolves against the body content
   * box at use time, which is what makes it track the fluid frame.
   *
   *   padding-inline = (frame_content - 864px) / 2   =>  text is always 864px
   *
   * The frame runs 960px (= --page-max, where padding computes to 0 and the
   * notes page is exactly a site page) up to 1200px. The grid is flipped to
   * `1fr 288px` so the sidebar is pinned at the width its entries need and the
   * article takes what is left, capped at 760px for measure. Past that cap the
   * slack becomes a gutter between article and sidebar rather than an
   * over-long line.
   *
   *   frame  960px -> content  864px -> article 576px, gutter   0px, toc 288px
   *   frame 1200px -> content 1104px -> article 760px, gutter  56px, toc 288px
   *
   * Only at >=1000px, where the grid exists. Below that wanshi's own clamp()
   * applies to a single-column article, which should fill the viewport.
   *
   * Mirrors --page-max and --pad-h in src/styles/global.css.
   */
  @media only screen and (min-width: 1000px) {
    :root body {
      /* Article fills its track; the cap keeps the measure readable. */
      --article-max-width: 760px;
      --toc-max-width: 288px;
      /* Holds the nav/footer text to an Astro page's 864px content box while
         their borders keep spanning the full frame. */
      --site-chrome-pad: max(0px, calc((100% - 864px) / 2));
    }

    body {
      max-width: clamp(960px, 88vw, 1200px);  /* floor = --page-max */
      padding-inline: 3rem;                   /* = --pad-h          */
    }

    /* wanshi sizes the article column and lets the sidebar take the remainder,
       which would leave the sidebar over-wide and ragged as the frame grows.
       Pin the sidebar instead and give the article the slack. */
    #grid-wrapper {
      grid-template-columns: minmax(0, 1fr) var(--toc-max-width);
    }
  }

  /* ── Site nav — mirrors src/components/Nav.astro ───────────────────────── */

  .site-nav {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1.5rem;
    flex-wrap: wrap;
    padding: 1.75rem var(--site-chrome-pad);
    border-bottom: 2px solid var(--accent);
    margin-bottom: 1.5rem;
  }

  .site-nav-name {
    font-family: var(--heading-font-family);
    font-size: 17px;
    font-weight: 400;
    font-style: normal;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-decoration: none;
  }

  .site-nav-name span {
    color: var(--accent);
    font-style: italic;
  }

  .site-nav-links {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .site-nav-links a {
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.04em;
    text-transform: lowercase;
  }

  .site-nav-links a.active,
  .site-nav-links a:hover {
    color: var(--accent);
  }

  /* ── Site footer — mirrors src/components/Footer.astro ─────────────────── */

  .site-footer {
    border-top: 2px solid var(--accent);
    padding: 1.5rem var(--site-chrome-pad);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
    margin-top: 3rem;
  }

  .site-footer-name {
    font-family: var(--heading-font-family);
    font-size: 13px;
    color: var(--muted);
  }

  .site-footer-links {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .site-footer-links a {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.03em;
  }

  .site-footer-links a:hover {
    color: var(--accent);
  }

  @media only screen and (max-width: 680px) {
    .site-nav {
      padding-top: 1.25rem;
      padding-bottom: 1.25rem;
    }
  }

  /*
   * wanshi's breadcrumb ("« Notes") is redundant with the nav's own `notes`
   * link on the forest root, but on a note page it is the way back up the
   * tree. Tone it down to a size that reads as secondary to the site nav
   * rather than competing with it.
   */
  body > header .logo {
    font-size: 1.05rem;
  }
</style>
