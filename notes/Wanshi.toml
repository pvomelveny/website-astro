# wanshi configuration for the notes forest embedded in the Astro site.
#
# Output goes straight into the Astro `public/` directory, which Astro copies
# verbatim into `dist/`. That means `npm run dev` serves the notes too, and the
# production build is a single `dist/` upload with no extra deploy step.
#
# See docs/users/configuration.md in the wanshi repo for every key.

[wanshi]
trees = "trees"
assets = "assets"
# Prefix for every generated link. Must match where the notes are served from.
# Kept root-relative so the same output works on the dev server, in
# `npm run preview`, and in production. The RSS feed that needs absolute URLs
# is generated by Astro instead (src/pages/rss.xml.ts), which already knows the
# canonical origin from astro.config.mjs.
base-url = "/notes/"
theme-lock = true
themes = []

[toc]
placement = "right"
sticky = true
mobile-sticky = true
max-width = "45ex"

[text]
edit = "[edit]"
toc = "Table of Contents"
references = "References"
backlinks = "Backlinks"
search = "Search  /"

[build]
typst-root = "trees"
short-slug = false
# Notes are linked without the `.html` suffix. wanshi still *writes* flat
# `.html` files — only the links change — so old `/notes/x.html` URLs keep
# working. Directory indexes are unaffected: they stay `/notes/algebra/`.
#
# This requires the host to resolve extensionless paths, which is not automatic:
# CloudFront serves S3 objects directly (no static-website hosting). Two pieces
# implement it, and they must stay in step with each other:
#   - production: the CloudFront Function in the README's deployment section
#   - dev server: the `notesDevUrls` Vite plugin in astro.config.ts
# `npm run preview` needs neither — it resolves extensionless paths itself.
pretty-urls = true
footer-mode = "link"
footer-sort-by = "date"
inline-css = false
inline-script = false
asref = false
output = "../public/notes"
search = true
search-content = true

[refs]
# Bibliographic works, exported from Zotero by Better BibTeX with "keep
# updated" so it stays in sync automatically. `npm run refs:sync` reads it and
# writes a note for every work cited under `dir` that does not have one yet.
#
# Hayagriva YAML, exported from Zotero. Better BibTeX can keep it updated
# automatically, so it never has to be touched by hand.
#
# Inside trees/ under a `_` directory on purpose. Discovery skips `_` dirs and
# only .typ/.typst are section extensions, so it can never become a page — while
# typst-root *is* trees/, so a note drafting paper prose can reach the same file
# natively:
#
#     #bibliography("/_bib/refs.yaml")
#
# That escape hatch is the reason for the location; a project-root path would
# close it off permanently. wanshi resolves this against the project root either
# way.
bibliography = "trees/_bib/refs.yaml"

dir = "refs"

[serve]
# Clicking [edit] on a served note opens it in Neovim. The `nvim://` scheme is
# handled by ~/Applications/WanshiEdit.app, an AppleScript bundle that forwards
# the URL to ~/.local/bin/wanshi-edit — macOS delivers the URL as an Apple
# Event, so a bare shell script could never receive it. The helper prefers a
# live Neovim session (via the socket ~/.config/nvim/init.lua records on
# FocusGained), then a tmux window, then a new Ghostty window.
#
# Serve-only, and a local convenience: [build].edit is left unset so published
# pages carry no edit link. wanshi appends the file's absolute path to this
# prefix.
edit = "nvim://file/"
# A scratch directory of its own, NOT `[build].output`. Serve mode ignores
# `base-url` and hardcodes it to `/`, because miniserve serves this directory at
# the root — so its pages link to `/welcome` and `/main.css` where the published
# ones link to `/notes/welcome` and `/notes/main.css`. Pointing both modes at
# `public/notes` therefore left whichever ran last serving links the other side
# could not resolve. Gitignored; `scripts/notes-serve.ts` mirrors the two
# generated indexes back into `public/notes` so nothing downstream goes stale.
output = "../.wanshi-serve"
command = ["miniserve", "<output>", "--index", "index.html", "--pretty-urls"]

[publish]
# Off deliberately: the site publishes one feed, at /rss.xml, built by Astro
# from wanshi.json. A second feed at /notes/feed.xml would compete with it and
# would require `base-url` to be absolute, which breaks local preview.
rss = false
